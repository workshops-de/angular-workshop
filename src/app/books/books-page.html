<input
  class="m-4 block rounded border border-gray-300 px-5 py-3"
  type="search"
  placeholder="Filter your books..."
  (input)="searchTerm.set($event.target.value)"
/>

<div class="m-4">
  <a
    routerLink="new"
    class="inline-block cursor-pointer rounded bg-blue-600 px-4 py-2 text-white transition-colors hover:bg-blue-700"
  >
    Create Book
  </a>
</div>

@if(booksResource.isLoading()) {
<p>Loading books...</p>
} @else if (booksResource.error(); as error) {
<p>Error: {{error.message}}</p>
} 


@for (book of booksComputed(); track book.isbn) {
<app-book-card [content]="book">
  <a
    [routerLink]="['detail', book.isbn]"
    class="inline-block cursor-pointer rounded border border-gray-300 px-4 py-2 text-gray-700 transition-colors hover:bg-gray-50"
  >
    Details
  </a>
</app-book-card>
}
