<div class="m-4">
  <h2>New</h2>

  <form [formRoot]="form">
    <label class="mt-4 block">
      <span class="mb-2 block">ISBN</span>
      <input
        [formField]="form.isbn"
        class="min-w-[250px] rounded border border-gray-300 px-5 py-3"
      />
      @if (form.isbn().pending()) {
      <small class="block text-blue-500">Checking ISBN…</small>
      } @else if (form.isbn().touched()) { @for (error of form.isbn().errors(); track error.kind) {
      <small class="block text-red-700">{{ error.message }}</small>
      } }
    </label>

    <label class="mt-4 block">
      <span class="mb-2 block">Title</span>
      <input
        [formField]="form.title"
        class="min-w-[250px] rounded border border-gray-300 px-5 py-3"
      />
      @if (form.title().touched()) { @for (error of form.title().errors(); track error.kind) {
      <small class="block text-red-700">{{ error.message }}</small>
      } }
    </label>

    <label class="mt-4 block">
      <span class="mb-2 block">Subtitle</span>
      <input
        [formField]="form.subtitle"
        class="min-w-[250px] rounded border border-gray-300 px-5 py-3"
      />
    </label>

    @for (author of form.authors; track $index; let authorIndex = $index) {
    <label class="mt-4 block">
      <span class="mb-2 block">Author</span>
      <input [formField]="author" class="min-w-[250px] rounded border border-gray-300 px-5 py-3" />
      @if (author().touched()) { @for (error of author().errors(); track error.kind) {
      <small class="block text-red-700">{{ error.message }}</small>
      } }
    </label>
    <button
      type="button"
      (click)="deleteAuthor(authorIndex)"
      class="cursor-pointer rounded border border-gray-300 px-4 py-2 text-gray-700 transition-colors hover:bg-gray-50"
    >
      Remove Author
    </button>
    }
    <button
      type="button"
      (click)="addAuthor()"
      class="cursor-pointer rounded border border-gray-300 px-4 py-2 text-gray-700 transition-colors hover:bg-gray-50"
    >
      Author hinzufügen
    </button>

    <label class="mt-4 block">
      <span class="mb-2 block">Abstract</span>
      <input
        [formField]="form.abstract"
        class="min-w-[250px] rounded border border-gray-300 px-5 py-3"
      />
    </label>

    <div class="mt-4">
      <button
        type="submit"
        [disabled]="form().invalid()"
        class="cursor-pointer rounded bg-blue-600 px-4 py-2 text-white transition-colors hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50"
      >
        Save
      </button>
    </div>
  </form>
</div>
