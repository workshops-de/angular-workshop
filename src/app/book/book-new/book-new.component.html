<h2>New</h2>

<form [formRoot]="form">
  <label class="form-field">
    <span>ISBN</span>
    <input [formField]="form.isbn" />
    @if (form.isbn().touched()) {
      @if (form.isbn().getError('required')) {
        <small>Please insert an Author.</small>
      } @else if (form.isbn().getError('minLength')) {
        <small>ISBN must be at least 5 characters long</small>
      } @else if (form.isbn().pending()) {
        <small>Checking ISBN…</small>
      } @else if (form.isbn().getError('duplicateIsbn')) {
        <small>This ISBN already exists</small>
      }
    }
  </label>

  <label class="form-field">
    <span>Title</span>
    <input [formField]="form.title" />
    @if (form.title().touched() && form.title().getError('required')) {
      <small>Please insert a title.</small>
    }
  </label>

  <label class="form-field">
    <span>Subtitle</span>
    <input [formField]="form.subtitle" />
  </label>

  @for (author of form.authors; track $index; let authorIndex = $index) {
    <label class="form-field">
      <span>Author</span>
      <input [formField]="author" />
      @if (author().touched()) {
        @if (author().getError('required')) {
          <small>Please insert an Author.</small>
        } @else if (author().getError('invalidAuthor')) {
          <small>Name must not contain digits</small>
        }
      }
    </label>
    <button type="button" (click)="deleteAuthor(authorIndex)">Remove Author</button>
  }
  <button type="button" (click)="addAuthor()">Author hinzufügen</button>

  <label class="form-field">
    <span>Abstract</span>
    <input [formField]="form.abstract" />
  </label>

  <div class="form-actions">
    <button type="submit" [disabled]="form().invalid()">Save</button>
  </div>
</form>
