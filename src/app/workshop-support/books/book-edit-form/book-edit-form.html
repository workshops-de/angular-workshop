<form class="form-fields">
  <label class="field-label">
    <span class="field-label-text">ISBN</span>
    <input class="field-input w-full bg-gray-100 text-gray-500" name="isbn" readonly />
    <small class="field-hint">
      The ISBN cannot be changed after a book has been created.
    </small>
  </label>

  <label class="field-label">
    <span class="field-label-text">Title</span>
    <input class="field-input w-full" name="title" />
  </label>

  <label class="field-label">
    <span class="field-label-text">Subtitle</span>
    <input class="field-input w-full" name="subtitle" />
  </label>

  <label class="field-label">
    <span class="field-label-text">Author</span>
    <input class="field-input w-full" name="author" />
  </label>

  <label class="field-label">
    <span class="field-label-text">Cover URL</span>
    <input
      class="field-input w-full"
      name="cover"
      placeholder="https://example.com/cover.jpg"
      (input)="onCoverInput($any($event.target).value)"
    />
  </label>

  <div class="cover-preview">
    <img
      class="cover-preview-image"
      [src]="coverPreview()"
      alt="Cover preview"
      (error)="coverBroken.set(true)"
    />
    <div>
      <span class="cover-preview-label">Cover preview</span>
      <p class="field-hint">
        Updates as you type the URL. Falls back to the placeholder when the URL
        is empty or cannot be loaded.
      </p>
    </div>
  </div>

  <label class="field-label">
    <span class="field-label-text">Abstract</span>
    <textarea class="field-input w-full" name="abstract" rows="4"></textarea>
  </label>

  <div class="form-actions">
    <button type="submit" class="btn-primary">Save</button>
  </div>
</form>
